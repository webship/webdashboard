include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # For now, build and test with Drupal 11.4 and PHP 8.4. Set globally, so
  # every job uses the same Drupal core and PHP versions.
  DRUPAL_CORE: "11.4.x-dev"
  _TARGET_PHP: "8.4"
  IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"
  # js/es/chart.js is the compiled Chart.js bundle.
  SKIP_ESLINT: "1"
  _CSPELL_IGNORE_PATHS: "js/es/*"
  _PHPUNIT_CONCURRENT: "0"
  # Also test with the next major Drupal version and the newest PHP.
  OPT_IN_TEST_NEXT_MAJOR: 1
  OPT_IN_TEST_MAX_PHP: 1

# Drupal 12: let Composer install the contributed modules that do not declare
# ^12 yet.
composer (next major):
  variables:
    _LENIENT_ALLOW_LIST: "display_builder,display_builder_ui,display_builder_page_layout,display_builder_entity_view,display_builder_views"
